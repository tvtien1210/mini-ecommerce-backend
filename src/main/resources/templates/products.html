<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Products - Chantaro Store</title>


    <!-- ==============================
         BOOTSTRAP
    ================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- ==============================
         CUSTOM CSS
    ================================== -->

    <link
            rel="stylesheet"
            href="/css/style.css">

    <link
            rel="stylesheet"
            href="/css/product.css">


    <!-- ==============================
         BOOTSTRAP ICONS
    ================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



</head>


<body>


<!-- =========================
     NAVBAR
========================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- ==============================
     PAGE HEADER
================================== -->

<section class="products-header py-5">

    <div class="container text-center">


        <h1 class="mb-3">

            Our Products

        </h1>


        <p class="text-secondary mb-0">

            Discover premium Apple products at Chantaro Store

        </p>


    </div>

</section>


<!-- ==============================
     PRODUCTS
================================== -->

<section class="products-section container pb-5">


    <!-- ==============================
         SEARCH + SORT
    ================================== -->

    <div class="row g-3 mb-4">


        <!-- Search -->

        <div class="col-12 col-lg-8">

            <div class="input-group">


                <span class="input-group-text bg-dark border-secondary text-secondary">

                    <i class="bi bi-search"></i>

                </span>


                <input
                        type="text"
                        class="form-control bg-dark text-light border-secondary"
                        placeholder="Search products...">


                <button
                        class="btn btn-primary"
                        type="button">

                    Search

                </button>


            </div>

        </div>


        <!-- Sort -->

        <div class="col-12 col-lg-4">

            <select
                    class="form-select bg-dark text-light border-secondary">

                <option value="">

                    Sort by: Latest

                </option>


                <option value="price-asc">

                    Price: Low to High

                </option>


                <option value="price-desc">

                    Price: High to Low

                </option>


                <option value="name">

                    Name: A-Z

                </option>


            </select>

        </div>


    </div>


    <!-- ==============================
         CATEGORY FILTER
    ================================== -->

    <div class="d-flex flex-wrap gap-2 mb-5">


        <button
                class="btn btn-primary">

            All

        </button>


        <button
                class="btn btn-outline-light">

            iPhone

        </button>


        <button
                class="btn btn-outline-light">

            MacBook

        </button>


        <button
                class="btn btn-outline-light">

            iPad

        </button>


        <button
                class="btn btn-outline-light">

            Apple Watch

        </button>


        <button
                class="btn btn-outline-light">

            Accessories

        </button>


    </div>


    <!-- ==============================
         PRODUCT RESULT
    ================================== -->

    <div
            class="d-flex
                   justify-content-between
                   align-items-center
                   mb-4">


        <h2 class="h4 mb-0">

            All Products

        </h2>


        <span class="text-secondary"
              th:text="${totalProducts + ' Products'}">

            12 Products

        </span>


    </div>


    <!-- =====================================================
      PRODUCT GRID
     ====================================================== -->

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-lg-4"
             th:each="product : ${products}">

            <!-- PRODUCT CARD -->

            <div class="card
                    product-card
                    text-center
                    p-4
                    h-100
                    d-flex
                    flex-column"
                 th:data-product-id="${product.id}">


                <!-- =========================================
                     PRODUCT IMAGE
                ========================================== -->

                <div class="product-image mb-3">

                    <img
                            th:src="${product.imageUrl}"
                            class="img-fluid"
                            th:alt="${product.name}">

                </div>


                <!-- =========================================
                     PRODUCT INFORMATION
                ========================================== -->

                <div class="product-info
                        d-flex
                        flex-column
                        flex-grow-1">


                    <!-- PRODUCT NAME -->

                    <h5 class="product-title text-light"
                        th:text="${product.name}">

                        iPhone 15 Pro

                    </h5>


                    <!-- PRODUCT DESCRIPTION -->

                    <p class="product-description text-secondary"
                       th:text="${product.description}">

                        Powerful performance with a premium
                        titanium design.

                    </p>


                    <!-- PRODUCT PRICE -->

                    <p class="product-price
                          text-primary
                          fw-bold"
                       th:text="${product.price}">

                        22.990.000 VND

                    </p>


                    <!-- PRODUCT STOCK -->

                    <p class="text-secondary small">

                        Stock:

                        <span class="text-light"
                              th:text="${product.stock}">

                        10

                    </span>

                    </p>


                    <!-- =====================================
                         ADD TO CART
                         mt-auto = push button to bottom
                    ====================================== -->

                    <button
                            type="button"
                            class="btn btn-primary w-100 mt-auto add-to-cart-btn"
                            th:data-product-id="${product.id}">

                        <i class="bi bi-cart-plus me-2"></i>

                        Add to Cart

                    </button>


                </div>

            </div>

        </div>

    </div>

    <!-- ==============================
         PAGINATION
    ================================== -->

    <!--    Pagination : chi hien thi khi co nhieu hon mot trang-->
    <nav
            th:if="${totalPages > 1}"
            aria-label="Product pagination"
            class="mt-5">


        <ul class="pagination justify-content-center">


            <!-- PREVIOUS-->

            <!-- Quay ve trang truoc-->
            <!-- append : cot vao, buoc vao , noi vao-->
            <!-- th:classappend : nghia la neu dang o trang dau tien thi them class disabled vao <li>-->
            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">

                <a
                        class="page-link"
                        th:href="@{/products(page=${currentPage - 1})}">

                    <i class="bi bi-chevron-left"></i>

                </a>

            </li>


            <!--  PAGE NUMBER-->

            <!--  Tao cac nut 1,2,3...-->
            <!--  sequence(0,totalPages-1)  : chuỗi -->
            <!--  Tao danh sach: 0,1,2, ..., totalPages-1-->
            <!--  VD: totalPages = 3 -> 0,1,2-->

            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0,totalPages - 1)}"
                th:classappend="${pageNumber == currentPage} ? 'active'"
            >

                <a
                        class="page-link"
                        th:href="@{/products(page=${pageNumber})}"
                        th:text="${pageNumber + 1}">
                </a>

            </li>


            <!-- NEXT-->

            <li class="page-item"
                th:classappend="${currentPage == totalPages -1} ? 'disabled'">

                <a
                        class="page-link"
                        th:href="@{/products(page = ${currentPage + 1})}">

                    <i class="bi bi-chevron-right"></i>

                </a>

            </li>


        </ul>


    </nav>


</section>

<!-- =========================================================
     TOAST
========================================================= -->

<div th:replace="~{fragments/toast::toast}"></div>



<!-- ==============================
     FOOTER
================================== -->

<footer class="text-center py-4">

    <p class="mb-0">

        © 2026 Chantaro Store

    </p>

</footer>


<!-- ==============================
     BOOTSTRAP JS
================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ==============================
     NAVBAR JS
================================== -->

<script
        type="module"
        src="/js/navbar.js">
</script>


<!-- ==============================
     PRODUCT JS
================================== -->

<script
        src="/js/common.js">
</script>

<script
        src="/js/product.js">
</script>


</body>

</html>
