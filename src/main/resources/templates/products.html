<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Products - Chantaro Store</title>


    <!-- ==============================
         BOOTSTRAP
    ================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- ==============================
         CUSTOM CSS
    ================================== -->

    <link
            rel="stylesheet"
            href="/css/style.css">

    <link
            rel="stylesheet"
            href="/css/product.css">


    <!-- ==============================
         BOOTSTRAP ICONS
    ================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



</head>


<body>


<!-- =========================
     NAVBAR
========================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- ==============================
     PAGE HEADER
================================== -->

<section class="products-header py-5">

    <div class="container text-center">


        <h1 class="mb-3">

            Our Products

        </h1>


        <p class="text-secondary mb-0">

            Discover premium Apple products at Chantaro Store

        </p>


    </div>

</section>


<!-- ==============================
     PRODUCTS
================================== -->

<section class="products-section container pb-5">


    <!-- ==============================
         SEARCH + SORT
    ================================== -->

    <div class="row g-3 mb-4">


        <!-- Search -->

        <div class="col-12 col-lg-8">

            <div class="input-group">


                <span class="input-group-text bg-dark border-secondary text-secondary">

                    <i class="bi bi-search"></i>

                </span>


                <input
                        id="search-keyword"
                        type="text"
                        class="form-control bg-dark text-light border-secondary"
                        placeholder="Search products...">


                <button
                        id="search-button"
                        class="btn btn-primary"
                        type="button">

                    Search

                </button>


            </div>

        </div>


        <!-- Sort -->

        <div class="col-12 col-lg-4">

            <select
                    class="form-select bg-dark text-light border-secondary">

                <option value="">

                    Sort by: Latest

                </option>


                <option value="price-asc">

                    Price: Low to High

                </option>


                <option value="price-desc">

                    Price: High to Low

                </option>


                <option value="name">

                    Name: A-Z

                </option>


            </select>

        </div>


    </div>


    <!-- ==============================
         CATEGORY FILTER
    ================================== -->

    <div class="d-flex flex-wrap gap-2 mb-5">


        <button
                class="btn btn-primary search-filter-keyword"
                data-keyword=""
        >

            All

        </button>


        <button
                class="btn btn-outline-light search-filter-keyword"
                data-keyword="iPhone"
        >

            iPhone

        </button>


        <button
                class="btn btn-outline-light search-filter-keyword"
                data-keyword="MacBook"
        >

            MacBook

        </button>


        <button
                class="btn btn-outline-light search-filter-keyword"
                data-keyword="iPad"
        >

            iPad

        </button>


        <button
                class="btn btn-outline-light search-filter-keyword"
                data-keyword="Apple Watch"
        >

            Apple Watch

        </button>


        <button
                class="btn btn-outline-light search-filter-keyword"
                data-keyword="Accessories"
        >

            Accessories

        </button>


    </div>


    <!-- ==============================
         PRODUCT RESULT
    ================================== -->

    <div
            class="d-flex
                   justify-content-between
                   align-items-center
                   mb-4">


        <h2 class="h4 mb-0">

            All Products

        </h2>


        <span
                id="total-products"
                class="text-secondary"
              >

            12 Products

        </span>


    </div>


    <!-- =====================================================
      PRODUCT GRID
     ====================================================== -->

    <div id="productContainer" class="row g-4">


    </div>



</section>

<!-- =========================================================
     TOAST
========================================================= -->

<div th:replace="~{fragments/toast::toast}"></div>



<!-- ==============================
     FOOTER
================================== -->

<footer class="text-center py-4">

    <p class="mb-0">

        © 2026 Chantaro Store

    </p>

</footer>


<!-- ==============================
     BOOTSTRAP JS
================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ==============================
     NAVBAR JS
================================== -->

<script
        type="module"
        src="/js/navbar.js">
</script>


<!-- ==============================
     PRODUCT JS
================================== -->

<script
        src="/js/common.js">
</script>

<script
        src="/js/product.js">
</script>


</body>

</html>
