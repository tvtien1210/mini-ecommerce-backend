<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chantaro Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Link to style.css-->
    <link rel="stylesheet" href="/css/style.css">
    <!--Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-black">
    <div class="container d-flex align-items-center">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="#"> Chantaro</a>

        <!-- Right side (luôn hiển thị) -->
        <div class="d-flex align-items-center gap-3 ms-auto order-lg-2">
            <a class="nav-link text-white" href="#">
                <i class="bi bi-person-circle"></i>
            </a>
            <a class="nav-link text-white" href="#">
                <i class="bi bi-cart3"></i>
            </a>

            <!-- Toggler -->
            <button class="navbar-toggler border-0"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <!-- Menu -->
        <div class="collapse navbar-collapse justify-content-center order-lg-1" id="nav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-light" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#">Category</a>
                </li>
            </ul>
        </div>

    </div>
</nav>


<!-- HERO -->

<section class="hero">

    <div class="container">

        <h1>Think Different</h1>

        <p class="text-secondary">Premium Apple Products</p>

        <button class="btn btn-primary btn-lg mt-3">Shop Now</button>

    </div>

</section>


<!-- PRODUCTS -->

<section class="container py-5">

    <h2 class="text-center mb-5">Featured Products</h2>

    <div class="row g-4">

        <!-- product -->

        <div class="col-md-4">

            <div class="card text-center p-4">

                <img src="/images/iphone15pro.png" class="img-fluid mb-3">

                <h5 class="text-light">iPhone 15 Pro</h5>

                <p class="price">$999</p>

                <button class="btn btn-primary">Add to Cart</button>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card text-center p-4">

                <img src="/images/macbookpro.png" class="img-fluid mb-3">

                <h5 class="text-light">MacBook Pro</h5>

                <p class="price">$1999</p>

                <button class="btn btn-primary">Add to Cart</button>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card text-center p-4">

                <img src="/images/airpodspro.png" class="img-fluid mb-3">

                <h5 class="text-light">AirPods Pro</h5>

                <p class="price">$249</p>

                <button class="btn btn-primary">Add to Cart</button>

            </div>

        </div>


    </div>

</section>


<!-- FOOTER -->

<footer class="text-center py-4">

    <p>© 2026 Chantaro Store</p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
