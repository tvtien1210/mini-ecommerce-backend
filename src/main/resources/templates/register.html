<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Register | Chantaro Store</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>


<body class="bg-black text-white min-vh-100">


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-black border-bottom border-secondary">

    <div class="container">


        <!-- Logo -->

        <a
                class="navbar-brand fw-bold fs-4"
                th:href="@{/}">

            <i class="bi bi-apple"></i>

            Chantaro Store

        </a>


        <!-- Back -->

        <a
                th:href="@{/}"
                class="text-secondary text-decoration-none">

            <i class="bi bi-arrow-left me-1"></i>

            Back

        </a>

    </div>

</nav>


<!-- =====================================================
     REGISTER
===================================================== -->

<main>

    <div class="container">

        <div
                class="row justify-content-center align-items-center"
                style="min-height: calc(100vh - 73px);">

            <div
                    class="col-12
                           col-sm-10
                           col-md-7
                           col-lg-5
                           col-xl-4">


                <!-- =================================================
                     REGISTER CARD
                ================================================== -->

                <div
                        class="card
                               bg-dark
                               text-white
                               border-secondary
                               rounded-4
                               shadow-lg">

                    <div class="card-body p-4 p-md-5">


                        <!-- =================================================
                             REGISTER FORM CONTAINER
                        ================================================== -->

                        <div id="registerFormContainer">


                            <!-- Register Icon -->

                            <div class="text-center mb-4">

                                <div
                                        class="bg-black
                                               border
                                               border-secondary
                                               rounded-circle
                                               d-inline-flex
                                               align-items-center
                                               justify-content-center"
                                        style="width: 70px; height: 70px;">

                                    <i
                                            class="bi bi-person-plus
                                                   fs-2
                                                   text-success">

                                    </i>

                                </div>

                            </div>


                            <!-- Title -->

                            <div class="text-center mb-4">

                                <h1 class="fw-bold h3 mb-2">

                                    Create Your Account

                                </h1>

                                <p class="text-secondary mb-0">

                                    Join Chantaro Store today

                                </p>

                            </div>


                            <!-- =================================================
                                 REGISTER ERROR
                            ================================================== -->

                            <div
                                    id="registerError"
                                    class="alert
                                           alert-danger
                                           d-none"
                                    role="alert">

                                <i
                                        class="bi
                                               bi-exclamation-circle
                                               me-2">
                                </i>

                                <span id="registerErrorMessage"></span>

                            </div>


                            <!-- =================================================
                                 REGISTER FORM
                            ================================================== -->

                            <form id="registerForm">


                                <!-- Full Name -->

                                <div class="mb-3">

                                    <label
                                            for="fullName"
                                            class="form-label text-light">

                                        Full Name

                                    </label>

                                    <div class="input-group">

                                        <span
                                                class="input-group-text
                                                       bg-black
                                                       border-secondary
                                                       text-secondary">

                                            <i class="bi bi-person-vcard"></i>

                                        </span>

                                        <input
                                                type="text"
                                                id="fullName"
                                                name="fullName"
                                                class="form-control
                                                       bg-black
                                                       text-white
                                                       border-secondary"
                                                placeholder="Enter your full name"
                                                autocomplete="name"
                                                required>

                                    </div>

                                </div>


                                <!-- Username -->

                                <div class="mb-3">

                                    <label
                                            for="username"
                                            class="form-label text-light">

                                        Username

                                    </label>

                                    <div class="input-group">

                                        <span
                                                class="input-group-text
                                                       bg-black
                                                       border-secondary
                                                       text-secondary">

                                            <i class="bi bi-person"></i>

                                        </span>

                                        <input
                                                type="text"
                                                id="username"
                                                name="username"
                                                class="form-control
                                                       bg-black
                                                       text-white
                                                       border-secondary"
                                                placeholder="Choose a username"
                                                autocomplete="username"
                                                required>

                                    </div>

                                </div>


                                <!-- Email -->

                                <div class="mb-3">

                                    <label
                                            for="email"
                                            class="form-label text-light">

                                        Email Address

                                    </label>

                                    <div class="input-group">

                                        <span
                                                class="input-group-text
                                                       bg-black
                                                       border-secondary
                                                       text-secondary">

                                            <i class="bi bi-envelope"></i>

                                        </span>

                                        <input
                                                type="email"
                                                id="email"
                                                name="email"
                                                class="form-control
                                                       bg-black
                                                       text-white
                                                       border-secondary"
                                                placeholder="Enter your email"
                                                autocomplete="email"
                                                required>

                                    </div>

                                </div>


                                <!-- Password -->

                                <div class="mb-3">

                                    <label
                                            for="password"
                                            class="form-label text-light">

                                        Password

                                    </label>

                                    <div class="input-group">

                                        <span
                                                class="input-group-text
                                                       bg-black
                                                       border-secondary
                                                       text-secondary">

                                            <i class="bi bi-lock"></i>

                                        </span>

                                        <input
                                                type="password"
                                                id="password"
                                                name="password"
                                                class="form-control
                                                       bg-black
                                                       text-white
                                                       border-secondary"
                                                placeholder="Create a password"
                                                autocomplete="new-password"
                                                required>

                                    </div>

                                </div>


                                <!-- Confirm Password -->

                                <div class="mb-3">

                                    <label
                                            for="confirmPassword"
                                            class="form-label text-light">

                                        Confirm Password

                                    </label>

                                    <div class="input-group">

                                        <span
                                                class="input-group-text
                                                       bg-black
                                                       border-secondary
                                                       text-secondary">

                                            <i class="bi bi-shield-lock"></i>

                                        </span>

                                        <input
                                                type="password"
                                                id="confirmPassword"
                                                name="confirmPassword"
                                                class="form-control
                                                       bg-black
                                                       text-white
                                                       border-secondary"
                                                placeholder="Confirm your password"
                                                autocomplete="new-password"
                                                required>

                                    </div>

                                </div>


                                <!-- Terms -->

                                <div class="form-check mb-4">

                                    <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="terms"
                                            required>

                                    <label
                                            class="form-check-label
                                                   text-secondary
                                                   small"
                                            for="terms">

                                        I agree to the

                                        <a
                                                href="#"
                                                class="text-success
                                                       text-decoration-none">

                                            Terms & Conditions

                                        </a>

                                    </label>

                                </div>


                                <!-- Register Button -->

                                <button
                                        type="submit"
                                        id="registerButton"
                                        class="btn btn-success
                                               w-100
                                               py-2
                                               fw-semibold">

                                    <i
                                            class="bi
                                                   bi-person-plus
                                                   me-2">
                                    </i>

                                    Create Account

                                </button>


                            </form>


                            <!-- =================================================
                                 LOGIN LINK
                            ================================================== -->

                            <div class="text-center mt-4">

                                <span class="text-secondary">

                                    Already have an account?

                                </span>

                                <a
                                        th:href="@{/login}"
                                        class="text-primary
                                               text-decoration-none
                                               fw-semibold
                                               ms-1">

                                    Sign In

                                </a>

                            </div>

                        </div>


                        <!-- =================================================
                             REGISTER SUCCESS
                        ================================================== -->

                        <!-- d-none không phải là tên của phần tử, mà là class Bootstrap dùng để ẩn phần tử -->
                        <div
                                id="registerSuccess"
                                class="d-none text-center">


                            <!-- Success Icon -->

                            <div
                                    class="bg-black
                                           border
                                           border-success
                                           rounded-circle
                                           d-inline-flex
                                           align-items-center
                                           justify-content-center
                                           mb-4"
                                    style="width: 70px; height: 70px;">

                                <i
                                        class="bi bi-check-lg
                                               fs-2
                                               text-success">

                                </i>

                            </div>


                            <!-- Success Title -->

                            <h2 class="fw-bold mb-2">

                                Account Created!

                            </h2>


                            <!-- Success Message -->

                            <p class="text-secondary mb-4">

                                Your account has been created successfully.

                                <br>

                                <span id = "registerSuccessUserDetail"></span>

                                <br>

                                Welcome to Chantaro Store.

                            </p>


                            <!-- Continue Login -->

                            <button
                                    type="button"
                                    id="continueLoginButton"
                                    class="btn btn-success
                                           w-100
                                           py-2
                                           fw-semibold">

                                <i
                                        class="bi
                                               bi-box-arrow-in-right
                                               me-2">

                                </i>

                                Continue to Login

                            </button>


                        </div>


                    </div>

                </div>


                <!-- =================================================
                     BRAND
                ================================================== -->

                <p
                        class="text-center
                               text-secondary
                               small
                               mt-4">

                     Chantaro Store

                </p>


            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
     REGISTER JS
===================================================== -->

<script src="/js/register.js"></script>


</body>

</html>
