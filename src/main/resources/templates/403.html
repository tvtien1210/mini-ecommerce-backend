<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>403 Access Denied - Chantaro Store</title>


    <!-- ==============================
         BOOTSTRAP
    ================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- ==============================
         BOOTSTRAP ICONS
    ================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <!-- ==============================
         CUSTOM CSS
    ================================== -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body class="bg-black text-light">


<!-- ==============================
     ERROR PAGE
================================== -->

<main class="container">


    <div class="row
                min-vh-100
                justify-content-center
                align-items-center">


        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">


            <!-- ==============================
                 ERROR CARD
            ================================== -->

            <div class="card
                        bg-dark
                        border
                        border-secondary
                        shadow-lg">


                <div class="card-body
                            text-center
                            p-4
                            p-md-5">


                    <!-- ==============================
                         ICON
                    ================================== -->

                    <div class="mb-4">

                        <div class="d-inline-flex
                                    align-items-center
                                    justify-content-center
                                    bg-danger
                                    border
                                    border-secondary
                                    rounded-circle
                                    p-4">

                            <i class="bi bi-shield-lock-fill
                                      display-4
                                      text-light"></i>

                        </div>

                    </div>


                    <!-- ==============================
                         ERROR CODE
                    ================================== -->

                    <div class="mb-2">

                        <span class="badge
                                     bg-light
                                     text-dark
                                     px-3
                                     py-2">

                            ERROR 403

                        </span>

                    </div>


                    <h1 class="display-5
                               fw-bold
                               text-warning
                               mb-3">

                        Access Denied

                    </h1>

                    <p class="text-secondary
                              mb-4
                              mx-auto"
                       style="max-width: 420px;">

                        You don't have permission to access this page.
                        Please return to the store or sign in with an
                        authorized account.

                    </p>
                    <p class="text-secondary
                              mb-4
                              mx-auto"
                       style="max-width: 420px;">

                        Bạn không có quyền truy cập vào trang này.
                        Vui lòng quay lại trang chủ hoặc đăng nhập lại với một tài khoản đã được cấp quyền 🍺

                    </p>


                    <!-- ==============================
                         ACTIONS
                    ================================== -->

                    <div class="d-flex
                                flex-column
                                flex-sm-row
                                justify-content-center
                                gap-2">


                        <!-- Back to Home -->

                        <a href="/"
                           class="btn
                                  btn-light
                                  px-4">

                            <i class="bi bi-house-door-fill me-2"></i>

                            Back to Home

                        </a>

                    </div>


                </div>

            </div>


            <!-- ==============================
                 BRAND
            ================================== -->

            <div class="text-center
                        mt-4">

                <a href="/"
                   class="text-secondary
                          text-decoration-none
                          small">

                    <i class="bi bi-laptop-fill me-1"></i>

                    Chantaro Store

                </a>

            </div>


        </div>

    </div>


</main>


<!-- ==============================
     BOOTSTRAP JS
================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
