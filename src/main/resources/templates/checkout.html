<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Chantaro Store</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body class="bg-black text-light">


<!-- =========================
     NAVBAR
========================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- =========================
     CHECKOUT
========================== -->

<div class="container py-5">

    <h2 class="mb-4">

        <i class="bi bi-credit-card me-2"></i>

        Checkout

    </h2>


    <!-- =========================
         CHECKOUT CONTENT
    ========================== -->

    <div class="row g-4">


        <!-- =========================
             ORDER ITEMS
        ========================== -->

        <div class="col-12 col-lg-8">

            <div class="card bg-dark text-light border-secondary shadow">

                <div class="card-header bg-black border-secondary py-3">
                    <h5 class="mb-0">
                        <i class="bi bi-cart3 me-2 text-success"></i>
                        Order Summary
                    </h5>
                </div>

                <div class="card-body p-3">

                    <!-- Items container -->
                    <div id="checkoutItems" class="d-flex flex-column gap-3">

                        <!-- JavaScript render Cart Items -->

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             ORDER TOTAL
        ========================== -->

        <div class="col-12 col-lg-4">

            <div
                    class="card bg-dark text-light border-secondary">

                <div class="card-header border-secondary">

                    <h5 class="mb-0">

                        Order Total

                    </h5>

                </div>


                <div class="card-body">


                    <div
                            class="d-flex justify-content-between mb-2">

                        <span>
                            Subtotal
                        </span>

                        <span id="checkoutSubtotal">
                            0
                        </span>

                    </div>

                    <div
                            class="d-flex justify-content-between mb-2">

                        <span>
                            Tax (0%)
                        </span>

                        <span id="checkoutTax">
                            0
                        </span>

                    </div>


                    <hr class="border-secondary">


                    <div
                            class="d-flex justify-content-between">

                        <strong>
                            Total
                        </strong>

                        <strong
                                class="text-success"
                                id="checkoutTotal">

                            0

                        </strong>

                    </div>


                    <!-- =========================
                         PAY BUTTON
                    ========================== -->

                    <button
                            id="payButton"
                            type="button"
                            class="btn btn-success w-100 mt-4">

                        <i class="bi bi-credit-card me-2"></i>

                        Pay with VNPay

                    </button>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/js/common.js"></script>

<script src="/js/navbar.js"></script>

<script src="/js/checkout.js"></script>


</body>

</html>
