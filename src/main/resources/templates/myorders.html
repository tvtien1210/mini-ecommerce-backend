<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders - Chantaro Store</title>


    <!-- =========================================
         BOOTSTRAP
    ========================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- =========================================
         BOOTSTRAP ICONS
    ========================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <!-- =========================================
         CUSTOM CSS
    ========================================== -->

    <link
            rel="stylesheet"
            href="/css/style.css">

</head>


<body
        class="text-light"
        style="background-color: #121212;">


<!-- =========================
     NAVBAR
========================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- ==================================================
     MAIN
================================================== -->

<main class="container py-5">


    <!-- =========================================
         PAGE HEADER
    ========================================== -->

    <div class="mb-5">

        <h1 class="fw-bold">

            <i class="bi bi-bag-check-fill text-primary me-2"></i>

            My Orders

        </h1>


        <p class="text-secondary mb-0">

            View and manage your orders

        </p>

    </div>


    <!-- =========================================
         ORDERS CONTAINER

         JavaScript sẽ render Order Cards
         vào đây bằng:

         ordersContainerElement.innerHTML = itemsHTML;
    ========================================== -->

    <div id="ordersContainer">

    </div>


    <!-- =========================================
         EMPTY ORDERS
    ========================================== -->

    <div
            id="emptyOrders"
            class="card
                   border-secondary
                   shadow
                   text-center
                   d-none"
            style="background-color: #1e1e1e;">


        <div
                class="card-body
                       py-5">


            <i
                    class="bi bi-bag-x
                           display-1
                           text-secondary">

            </i>


            <h4 class="mt-4 text-light">

                No Orders Yet

            </h4>


            <p class="text-secondary">

                You haven't placed any orders yet.

            </p>


            <a
                    th:href="@{/products}"
                    class="btn btn-primary">

                <i
                        class="bi bi-shop me-1">
                </i>

                Start Shopping

            </a>

        </div>

    </div>


</main>



<!-- ==================================================
     FOOTER
================================================== -->

<footer
        class="text-secondary
               text-center
               py-4
               mt-5
               border-top
               border-secondary"
        style="background-color: #000000;">

    <p class="mb-0">

        © 2026 Chantaro Store

    </p>

</footer>



<!-- ==================================================
     BOOTSTRAP JS
================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ==================================================
     COMMON JS
================================================== -->

<script
        src="/js/common.js">
</script>


<!-- ==================================================
     NAVBAR JS
================================================== -->

<script
        src="/js/navbar.js">
</script>


<!-- ==================================================
     MY ORDERS JS
================================================== -->

<script
        src="/js/myorders.js">
</script>


</body>

</html>
