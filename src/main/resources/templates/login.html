<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Login | Chantaro Store</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>


<body class="bg-black text-white min-vh-100">


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-black border-bottom border-secondary">

    <div class="container">

        <!-- Logo -->

        <a
                class="navbar-brand fw-bold fs-4"
                th:href="@{/}">

            <i class="bi bi-laptop-fill"></i>

        </a>


        <!-- Back to Store -->

        <a
                th:href="@{/}"
                class="text-secondary text-decoration-none">

            <i class="bi bi-arrow-left me-1"></i>

            Back

        </a>

    </div>

</nav>


<!-- =====================================================
     LOGIN
===================================================== -->

<main>

    <div class="container">

        <div
                class="row justify-content-center align-items-center"
                style="min-height: calc(100vh - 73px);">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">


                <!-- Login Card -->

                <div
                        class="card bg-dark text-white border-secondary rounded-4 shadow-lg">

                    <div class="card-body p-4 p-md-5">


                        <!-- Icon -->

                        <div class="text-center mb-4">

                            <div
                                    class="bg-black border border-secondary
                                           rounded-circle
                                           d-inline-flex
                                           align-items-center
                                           justify-content-center"
                                    style="width: 70px; height: 70px;">

                                <i
                                        class="bi bi-person fs-2 text-primary">
                                </i>

                            </div>

                        </div>


                        <!-- Title -->

                        <div class="text-center mb-4">

                            <h1 class="fw-bold h3 mb-2">
                                Welcome Back
                            </h1>

                            <p class="text-secondary mb-0">
                                Sign in to your account
                            </p>

                        </div>


                        <!-- Login Form -->

                        <form id="loginForm">

                            <div id = "loginError"
                                 class= "alert alert-danger d-none"
                            >
                                <span id = "loginErrorMessage"></span>

                            </div>


                            <!-- Username -->

                            <div class="mb-3">
                                <label for="username" class="form-label text-light"> Username</label>

                                <div class="input-group">

                                    <span class="input-group-text bg-black border-secondary text-secondary">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input
                                            type="text"
                                            id="username"
                                            name="username"
                                            class="form-control
                                                   bg-black
                                                   text-white
                                                   border-secondary"
                                            placeholder="Enter your username"
                                            autocomplete="username"
                                            required>
                                </div>
                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label
                                        for="password"
                                        class="form-label text-light">

                                    Password

                                </label>

                                <div class="input-group">

                                    <span
                                            class="input-group-text
                                                   bg-black
                                                   border-secondary
                                                   text-secondary">

                                        <i class="bi bi-lock"></i>

                                    </span>

                                    <input
                                            type="password"
                                            id="password"
                                            name="password"
                                            class="form-control
                                                   bg-black
                                                   text-white
                                                   border-secondary"
                                            placeholder="Enter your password"
                                            autocomplete="current-password"
                                            required>

                                </div>

                            </div>


                            <!-- Remember / Forgot -->

                            <div
                                    class="d-flex
                                           justify-content-between
                                           align-items-center
                                           mb-4">

                                <div class="form-check">

                                    <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="rememberMe">

                                    <label
                                            class="form-check-label
                                                   text-secondary"
                                            for="rememberMe">

                                        Remember me

                                    </label>

                                </div>


                                <a
                                        href="#"
                                        class="text-primary
                                               text-decoration-none
                                               small">

                                    Forgot password?

                                </a>

                            </div>


                            <!-- Login Button -->

                            <button
                                    type="submit"
                                    class="btn btn-primary
                                           w-100
                                           py-2
                                           fw-semibold">

                                <i class="bi bi-box-arrow-in-right me-2"></i>

                                Login

                            </button>


                        </form>


                        <!-- Register -->

                        <div class="text-center mt-4">

                            <span class="text-secondary">
                                Don't have an account?
                            </span>

                            <a
                                    th:href="@{/register}"
                                    class="text-primary
                                           text-decoration-none
                                           fw-semibold
                                           ms-1">

                                Create Account

                            </a>

                        </div>

                    </div>

                </div>


                <!-- Brand -->

                <p
                        class="text-center
                               text-secondary
                               small
                               mt-4">

                    <i class="bi bi-laptop-fill"></i> Chantaro Store

                </p>

            </div>

        </div>

    </div>

</main>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Login JS -->
<script src="/js/login.js"></script>


</body>

</html>
